name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private data, credentials, or unlicensed assets.
  - type: textarea
    id: current
    attributes:
      label: What happened?
      description: Describe the incorrect behavior and where you saw it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest spell/build and exact steps that reproduce the issue.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or exported JSON
      description: Drag files here. Remove personal or private information first.
